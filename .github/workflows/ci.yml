name: TriRecon CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyflakes

      - name: Syntax check all Python files
        run: |
          python -m pyflakes trirecon.py core/

      - name: Verify imports resolve correctly
        run: |
          python -c "from core import portscan, hostdiscovery, dirbrute, report, storage; print('All imports OK')"

      - name: Verify CLI loads
        run: |
          python trirecon.py --help
